<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Tree - Arbre de Révision DNB (Cyber Edition)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Orbitron:wght@700;900&display=swap');

    :root {
      --bg-dark: #090d16;
      --card-bg: #111827;
      --card-border: #1f293d;
      --neon-cyan: #00f0ff;
      --neon-pink: #ff007f;
      --neon-green: #00ff88;
      --neon-purple: #8a2be2;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --glow-cyan: 0 0 15px rgba(0, 240, 255, 0.4);
      --glow-pink: 0 0 15px rgba(255, 0, 127, 0.4);
      --glow-green: 0 0 15px rgba(0, 255, 136, 0.4);
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 950px;
    }

    /* --- HERO HEADER --- */
    .hero-header {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 30px 25px;
      text-align: center;
      box-sizing: border-box;
      margin-bottom: 25px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .hero-header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
      box-shadow: var(--glow-cyan);
    }

    .hero-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      margin: 0 0 10px 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hero-title span {
      color: var(--neon-cyan);
      text-shadow: var(--glow-cyan);
    }

    .hero-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin: 0;
    }

    /* --- NAVIGATION --- */
    .nav-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      width: 100%;
      margin: 0 auto 25px auto;
      padding: 10px 12px;
      background: var(--card-bg);
      border: 1.5px solid rgba(0, 240, 255, 0.3);
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
      box-sizing: border-box;
      flex-wrap: nowrap;
      overflow-x: auto;
    }

    .nav-btn {
      font-family: 'Orbitron', system-ui, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      text-decoration: none;
      color: var(--text-muted);
      background: #1a2332;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .nav-btn:hover {
      color: var(--neon-cyan);
      border-color: var(--neon-cyan);
      background: rgba(0, 243, 255, 0.08);
    }

    .nav-btn.active {
      color: #0b0e14;
      background: var(--neon-cyan);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
    }

    /* --- PROGRESS BAR --- */
    .progress-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
    }

    .progress-bar-bg {
      width: 100%;
      height: 14px;
      background: #1a2332;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(0, 240, 255, 0.2);
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green));
      box-shadow: var(--glow-green);
      transition: width 0.5s ease;
    }

    /* --- SKILL TREE CONTAINER --- */
    .tree-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      padding: 20px 0;
    }

    /* Connector Line */
    .tree-wrapper::before {
      content: '';
      position: absolute;
      top: 50px;
      bottom: 50px;
      width: 4px;
      background: linear-gradient(180deg, var(--neon-cyan), var(--card-border));
      z-index: 1;
    }

    .tree-node {
      position: relative;
      z-index: 2;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      width: 100%;
      max-width: 500px;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: all 0.3s ease;
    }

    /* Statuses */
    .tree-node.locked {
      opacity: 0.5;
      filter: grayscale(0.8);
      border-color: var(--card-border);
    }

    .tree-node.unlocked {
      opacity: 1;
      border-color: var(--neon-cyan);
      box-shadow: var(--glow-cyan);
    }

    .tree-node.completed {
      opacity: 1;
      border-color: var(--neon-green);
      box-shadow: var(--glow-green);
      background: rgba(0, 255, 136, 0.05);
    }

    .node-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #1a2332;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .completed .node-icon {
      background: var(--neon-green);
      color: #000;
    }

    .node-info {
      flex: 1;
    }

    .node-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin: 0 0 5px 0;
    }

    .node-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin: 0 0 10px 0;
    }

    .node-btn {
      background: transparent;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .node-btn:hover {
      background: var(--neon-cyan);
      color: var(--bg-dark);
    }

    .tree-node.locked .node-btn {
      display: none;
    }

    .completed .node-btn {
      border-color: var(--neon-green);
      color: var(--neon-green);
    }

    .completed .node-btn:hover {
      background: var(--neon-green);
      color: var(--bg-dark);
    }

    .reset-btn {
      background: rgba(255, 0, 127, 0.1);
      border: 1px solid var(--neon-pink);
      color: var(--neon-pink);
      padding: 8px 16px;
      border-radius: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 20px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .reset-btn:hover {
      background: var(--neon-pink);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- HERO HEADER -->
    <header class="hero-header">
      <h1 class="hero-title">🗺️ Skill Tree <span>DNB</span></h1>
      <p class="hero-subtitle">Débloque tes compétences chapitre par chapitre pour maîtriser le Brevet !</p>
    </header>

    <!-- NAVIGATION -->
    <nav class="nav-container">
      <a href="index.html" class="nav-btn">🏠 Index DNB</a>
      <a href="skilltree.html" class="nav-btn active">🗺️ Skill Tree</a>
      <a href="annales.html" class="nav-btn">📚 Annales</a>
      <a href="calculateur.html" class="nav-btn">🧮 Calculateur</a>
      <a href="quiz.html" class="nav-btn">⚡ Quiz DNB</a>
      <a href="cours.html" class="nav-btn">📖 Cours DNB</a>
      <a href="faq.html" class="nav-btn">❓ FAQ DNB</a>
    </nav>

    <!-- PROGRESS BAR -->
    <div class="progress-card">
      <div class="progress-header">
        <span>Niveau de Progression DNB</span>
        <span id="progress-text">0% Completing</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- SKILL TREE NODES -->
    <div class="tree-wrapper" id="tree-container">
      <!-- Nodes will be loaded by JS -->
    </div>

    <button class="reset-btn" onclick="resetProgress()">🔄 Réinitialiser la progression</button>

  </div>

  <script>
    // Chapter Nodes Configuration
    const nodesData = [
      { id: 1, title: "📐 Mathématiques : Théorème de Pythagore", desc: "Calculs de longueurs et réciproque dans un triangle rectangle.", icon: "📐" },
      { id: 2, title: "✍️ Français : Figures de Style", desc: "Identifier les métaphores, hyperboles et comparaisons.", icon: "✍️" },
      { id: 3, title: "📜 Histoire : La Première Guerre Mondiale", desc: "Phases de la guerre, guerre de position et bilan de 1914-1918.", icon: "📜" },
      { id: 4, title: "🧬 SVT : Génétique et ADN", desc: "Comprendre les chromosomes, gènes et la transmission des caractères.", icon: "🧬" },
      { id: 5, title: "📐 Mathématiques : Théorème de Thalès", desc: "Proportionnalité et droites parallèles.", icon: "📏" },
      { id: 6, title: "⚡ Physique-Chimie : Électricité", desc: "Loi d'Ohm, tension, intensité et puissance électrique.", icon: "⚡" }
    ];

    // Load saved progress from LocalStorage
    let userProgress = JSON.parse(localStorage.getItem('dnb_skill_tree')) || [1]; // Node 1 unlocked by default

    function renderTree() {
      const container = document.getElementById('tree-container');
      container.innerHTML = '';

      let completedCount = 0;

      nodesData.forEach((node, index) => {
        const isUnlocked = userProgress.includes(node.id);
        const isCompleted = userProgress.includes(node.id + 1) || (userProgress.includes(node.id) && index === nodesData.length - 1 && localStorage.getItem('dnb_node_' + node.id) === 'done');

        if (isCompleted) completedCount++;

        let statusClass = 'locked';
        let btnText = '🔒 Verrouillé';

        if (isCompleted) {
          statusClass = 'completed';
          btnText = '✅ Complété';
        } else if (isUnlocked) {
          statusClass = 'unlocked';
          btnText = '🎯 Marquer comme fait';
        }

        const nodeHTML = `
          <div class="tree-node ${statusClass}">
            <div class="node-icon">${isCompleted ? '✅' : node.icon}</div>
            <div class="node-info">
              <h3 class="node-title">${node.title}</h3>
              <p class="node-desc">${node.desc}</p>
              ${isUnlocked ? `<button class="node-btn" onclick="completeNode(${node.id})">${btnText}</button>` : ''}
            </div>
          </div>
        `;
        container.innerHTML += nodeHTML;
      });

      // Update Progress Bar
      const percentage = Math.round((completedCount / nodesData.length) * 100);
      document.getElementById('progress-fill').style.width = percentage + '%';
      document.getElementById('progress-text').innerText = percentage + '% Complété';
    }

    function completeNode(id) {
      if (!userProgress.includes(id + 1)) {
        userProgress.push(id + 1); // Unlock next node
      }
      localStorage.setItem('dnb_node_' + id, 'done');
      localStorage.setItem('dnb_skill_tree', JSON.stringify(userProgress));
      renderTree();
    }

    function resetProgress() {
      if (confirm("Veux-tu vraiment réinitialiser toute ta progression ?")) {
        localStorage.removeItem('dnb_skill_tree');
        nodesData.forEach(n => localStorage.removeItem('dnb_node_' + n.id));
        userProgress = [1];
        renderTree();
      }
    }

    // Initial Render
    renderTree();
  </script>
</body>
</html>
